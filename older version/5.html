<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>macOS Calculator</title>

  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .calculator {
      width: 1480px;
      background: #1d1d1e;
      border-radius: 34px;
      border: 1px solid #252528;
      padding: 18px;
      position: relative;
      box-shadow:
        inset 1px 1px 0 0 rgba(255, 255, 255, 0.4),     
        inset -1px -1px 0 0 rgba(255, 255, 255, 0.16),   
        0 25px 50px rgba(0, 0, 0, 0.6);
      transition: width 0.25s ease;
    }

    .calculator.basic-mode {
      width: 500px;
    }

    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .traffic {
      display: flex;
      gap: 14px;
      padding-left: 6px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .red { background: #ff5b60; }
    .yellow { background: #fac803; }
    .gray { background: #434345; }

    .toggle-area {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .mode-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #2c2c31;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.15s ease;
      font-size: 26px;
      box-shadow: 
        inset 1px 1px 0 rgba(255, 255, 255, 0.2),
        inset -1px -1px 0 rgba(255, 255, 255, 0.08);
    }

    .mode-btn:hover {
      transform: scale(1.04);
      filter: brightness(1.3);
    }

    .display {
      height: 210px;
      max-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0px 0px 10px; /* Pushed fully right up against the edge bounds */
      position: relative;
      overflow: hidden;
    }

    .sub-display {
      min-height: 34px;
      font-size: 26px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 6px;
      overflow-x: auto;
      max-width: 100%;
      white-space: nowrap;
      scrollbar-width: none;
      text-align: right;
    }
    .sub-display::-webkit-scrollbar { display: none; }

    .rad-indicator {
      position: absolute;
      left: 4px;
      bottom: 10px;
      font-size: 18px;
      color: rgb(255, 255, 255);
      visibility: hidden;
    }
    .rad-indicator.visible { visibility: visible; }

    .main-display {
      font-size: 76px;
      font-weight: 300;
      line-height: 1.0;
      text-align: right;
      word-break: break-all;
      overflow-wrap: break-word;
      max-width: 100%;
      max-height: 154px;
      scrollbar-width: none;
    }
    .main-display::-webkit-scrollbar { display: none; }

    .main-display mjx-container {
      max-width: 100% !important;
      text-align: right !important;
      display: inline-block !important;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 12px;
    }

    .calculator.basic-mode .buttons {
      grid-template-columns: repeat(4, 1fr);
    }

    .btn {
      height: 102px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 42px;
      color: #ffffff;
      background: #505051;
      transition: 0.12s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0 10px;
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.2),     
        inset -1.5px -1.5px 1px rgba(255, 255, 255, 0.08),
        0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn.light {
      background: #7c7c7d;
      font-weight: 500;
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.6),     
        inset -1px -1px 1px rgba(255, 255, 255, 0.2),    
        0 2px 4px rgba(0, 0, 0, 0.12);
    }

    .btn.orange {
      background: #ff9b00;
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.45),     
        inset -1px -1px 1px rgba(255, 255, 255, 0.1),    
        0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn.scientific-only {
      background: #363637;
      font-size: 34px;
    }

    .btn.active-toggle {
      background: #666667;
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.2),     
        inset -1.5px -1.5px 1px rgba(255, 255, 255, 0.08),
        0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn img {
      width: 48px;
      height: 48px;
      filter: invert(1);
      pointer-events: none;
    }

    @media (max-width: 1520px) {
      .calculator:not(.basic-mode) { width: 96vw; }
      .btn { height: 86px; font-size: 34px; }
      .btn.scientific-only { font-size: 28px; }
      .btn img { width: 38px; height: 38px; }
      .main-display { font-size: 68px; }
    }

    @media (max-width: 980px) {
      .calculator:not(.basic-mode) { width: 520px; }
      .display { height: 170px; max-height: 170px; }
      .main-display { font-size: 64px; }
      .calculator:not(.basic-mode) .buttons { grid-template-columns: repeat(4, 1fr); }
      .scientific-only { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="calculator basic-mode" id="calcContainer">
    <div class="titlebar">
      <div class="traffic">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot gray"></div>
      </div>

      <div class="toggle-area">
        <button class="mode-btn" id="scientificToggle">⌘</button>
      </div>
    </div>

    <div class="display">
      <div class="sub-display" id="subDisplay"></div>
      <div class="rad-indicator" id="radIndicator">Rad</div>
      <div class="main-display" id="mainDisplay">0</div>
    </div>

    <div class="buttons" id="buttons"></div>
  </div>

  <script>
    const buttonsContainer = document.getElementById('buttons');
    const calcContainer = document.getElementById('calcContainer');
    const mainDisplay = document.getElementById('mainDisplay');
    const subDisplay = document.getElementById('subDisplay');

    let expression = '';
    let scientificMode = false;
    let secondMode = false;
    let isDeg = true; 
    let memory = 0;
    let hasEvaluated = false; 

    let holdTimer = null;
    let holdInterval = null;

    function getScientificButtons() {
      return [
        [
          { latex: '(', value: '(' },
          { latex: ')', value: ')' },
          { latex: 'mc', action: 'memClear' },  
          { latex: 'm+', action: 'memAdd' },    
          { latex: 'm-', action: 'memSub' },    
          { latex: 'mr', action: 'memRecall', class: memory !== 0 ? 'active-toggle' : '' }, 
        ],
        [
          { latex: '2^{nd}', action: 'secondToggle', class: secondMode ? 'active-toggle' : '' },
          { latex: 'x^2', value: '^2' },
          { latex: 'x^3', value: '^3' },
          { latex: 'x^y', value: '^', class: (expression.endsWith('^') && !expression.endsWith('e^') && !expression.endsWith('10^') && !expression.endsWith('2^')) ? 'active-toggle' : '' },
          { latex: secondMode ? 'y^x' : 'e^x', value: secondMode ? '^' : 'e^', class: (secondMode ? (expression.endsWith('^') && !expression.endsWith('e^') && !expression.endsWith('10^') && !expression.endsWith('2^')) : expression.endsWith('e^')) ? 'active-toggle' : '' },
          { latex: secondMode ? '2^x' : '10^x', value: secondMode ? '2^' : '10^', class: (secondMode ? expression.endsWith('2^') : expression.endsWith('10^')) ? 'active-toggle' : '' }
        ],
        [
          { latex: '\\frac{1}{x}', value: '1/' },
          { latex: '\\sqrt[2]{x}', value: 'sqrt(' },
          { latex: '\\sqrt[3]{x}', value: 'cbrt(' },
          { latex: '\\sqrt[y]{x}', value: 'nthRoot(' },
          { latex: secondMode ? '\\log_y' : '\\ln', value: secondMode ? 'log(' : 'ln(' },
          { latex: secondMode ? '\\log_2' : '\\log_{10}', value: secondMode ? 'log2(' : 'log10(' }
        ],
        [
          { latex: 'x!', value: '!' },
          { latex: secondMode ? '\\sin^{-1}' : '\\sin', value: secondMode ? 'asin(' : 'sin(' },
          { latex: secondMode ? '\\cos^{-1}' : '\\cos', value: secondMode ? 'acos(' : 'cos(' },
          { latex: secondMode ? '\\tan^{-1}' : '\\tan', value: secondMode ? 'atan(' : 'tan(' },
          { latex: 'e', value: 'e' },
          { latex: 'EE', value: 'E', class: expression.endsWith('E') ? 'active-toggle' : '' } 
        ],
        [
          { latex: secondMode ? ',' : 'Rand', action: secondMode ? undefined : 'generateRandom', value: secondMode ? ',' : undefined }, 
          { latex: secondMode ? '\\sinh^{-1}' : '\\sinh', value: secondMode ? 'asinh(' : 'sinh(' },
          { latex: secondMode ? '\\cosh^{-1}' : '\\cosh', value: secondMode ? 'acosh(' : 'cos(' },
          { latex: secondMode ? '\\tanh^{-1}' : '\\tanh', value: secondMode ? 'atanh(' : 'tanh(' },
          { latex: '\\pi', value: 'pi' },
          { latex: isDeg ? 'Rad' : 'Deg', action: 'toggleDeg' }
        ]
      ];
    }

    function getCoreButtons() {
      const clearLabel = (expression === '' || expression === '0') ? 'AC' : 'C';
      return [
        [
          { latex: '\\boxed{\\times}', action: 'backspace', class: 'light', icon: 'delete-left.svg' },
          { latex: clearLabel, action: 'clear', class: 'light' },
          { latex: '\\%', value: '%', class: 'light', icon: 'percentage.svg' },
          { latex: '\\div', value: '/', class: 'orange', icon: 'divide.svg' }
        ],
        [
          { latex: '7', value: '7' },
          { latex: '8', value: '8' },
          { latex: '9', value: '9' },
          { latex: '\\times', value: '*', class: 'orange', icon: 'multiply.svg' }
        ],
        [
          { latex: '4', value: '4' },
          { latex: '5', value: '5' },
          { latex: '6', value: '6' },
          { latex: '-', value: '-', class: 'orange', icon: 'minus.svg' }
        ],
        [
          { latex: '1', value: '1' },
          { latex: '2', value: '2' },
          { latex: '3', value: '3' },
          { latex: '+', value: '+', class: 'orange', icon: 'plus.svg' }
        ],
        [
          { latex: '\\pm', action: 'negate', icon: 'plus-minus.svg' },
          { latex: '0', value: '0' },
          { latex: '.', value: '.' },
          { latex: '=', action: 'evaluate', class: 'orange', icon: 'equal.svg' }
        ]
      ];
    }

    function createButton(btnData, extraClass = '') {
      const button = document.createElement('button');
      button.className = `btn ${btnData.class || ''} ${extraClass}`;
      
      if (btnData.icon) {
        button.innerHTML = `<img src="${btnData.icon}">`;
      } else if (extraClass.includes('scientific-only')) {
        button.innerHTML = `$${btnData.latex}$`;
      } else {
        button.textContent = btnData.latex;
      }

      button.addEventListener('pointerdown', (e) => {
        button.releasePointerCapture(e.pointerId);
        
        if (btnData.action) {
          handleAction(btnData.action);

          if (btnData.action === 'backspace') {
            holdTimer = setTimeout(() => {
              holdInterval = setInterval(() => {
                handleAction('backspace');
              }, 60);
            }, 450);
          }

          if (btnData.action === 'clear' && expression !== '' && expression !== '0') {
            holdTimer = setTimeout(() => {
              expression = '';
              subDisplay.innerHTML = '';
              renderButtons();
              updateMainDisplay('0');
              clearPressTimers();
            }, 600);
          }
        } else if (btnData.value !== undefined) {
          appendToExpression(btnData.value);
        }
      });

      button.addEventListener('pointerup', clearPressTimers);
      button.addEventListener('pointerleave', clearPressTimers);
      button.addEventListener('pointercancel', clearPressTimers);

      return button;
    }

    function clearPressTimers() {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
    }

    function renderButtons() {
      buttonsContainer.innerHTML = '';
      const coreButtons = getCoreButtons();

      const radIndicator = document.getElementById('radIndicator');
      if (radIndicator) {
        radIndicator.classList.toggle('visible', !isDeg && scientificMode);
      }

      if (scientificMode) {
        calcContainer.classList.remove('basic-mode');
        calcContainer.classList.add('scientific-mode');
        const sciButtons = getScientificButtons();
        
        for (let row = 0; row < 5; row++) {
          sciButtons[row].forEach(btn => {
            const button = createButton(btn, 'scientific-only');
            buttonsContainer.appendChild(button);
          });

          coreButtons[row].forEach(btn => {
            const button = createButton(btn);
            buttonsContainer.appendChild(button);
          });
        }
      } else {
        calcContainer.classList.remove('scientific-mode');
        calcContainer.classList.add('basic-mode');
        
        coreButtons.forEach(row => {
          row.forEach(btn => {
            const button = createButton(btn);
            buttonsContainer.appendChild(button);
          });
        });
      }

      MathJax.typesetClear([buttonsContainer]);
      MathJax.typesetPromise([buttonsContainer]);
    }

    function appendToExpression(value) {
      if (hasEvaluated) {
        hasEvaluated = false;
        const incomingIsOperator = /^[+\-*\/^%,]/;
        if (!incomingIsOperator.test(value)) {
          expression = '0';
        }
      }

      if ((value === 'log(' || value === 'nthRoot(') && expression !== '' && expression !== '0') {
        const match = expression.match(/([0-9.]+|pi|e)$/);
        if (match) {
          expression = expression.slice(0, expression.length - match[0].length) + value + match[0] + ',';
          renderButtons();
          updateMainDisplay(expression);
          return;
        }
      }

      const incomingIsOperator = /^[+\-*\/^%,]/;
      if (expression === '0' && !incomingIsOperator.test(value) && value !== '.' && value !== ',') {
        expression = value;
      } else {
        expression += value;
      }
      renderButtons();
      updateMainDisplay(expression);
    }

    function handleAction(action) {
      switch(action) {
        case 'clear':
          hasEvaluated = false;
          if (expression !== '' && expression !== '0') {
            const matchToken = expression.match(/([a-zA-Z0-9_]+\()|([0-9.]+[E][+-]?[0-9]*)|([0-9.]+)|([E][+-]?[0-9]*)|([+\-*/%^(),e]|\bpi\b)/g);
            if (matchToken && matchToken.length > 0) {
              matchToken.pop(); 
              expression = matchToken.join('');
            } else {
              expression = '';
            }
            if (expression === '') expression = '0';
          } else {
            expression = '';
            subDisplay.innerHTML = '';
          }
          renderButtons();
          updateMainDisplay(expression || '0');
          break;

        case 'backspace':
          hasEvaluated = false;
          expression = expression.slice(0, -1);
          renderButtons();
          updateMainDisplay(expression || '0');
          break;

        case 'evaluate':
          evaluateExpression();
          break;

        case 'generateRandom':
          try {
            const randVal = math.random();
            expression = String(math.format(randVal, { precision: 14 }));
            hasEvaluated = true; 
            renderButtons();
            updateMainDisplay(expression);
          } catch (e) {
            expression = '0';
            updateMainDisplay(expression);
          }
          break;

        case 'negate':
          hasEvaluated = false;
          if (expression && expression !== '0') {
            try {
              let cleanTarget = getParsedMathExpression(expression);
              if (cleanTarget.endsWith('^')) cleanTarget = cleanTarget.slice(0, -1);
              
              const openCount = (cleanTarget.match(/\(/g) || []).length;
              const closeCount = (cleanTarget.match(/\)/g) || []).length;
              if (openCount > closeCount) {
                cleanTarget += ')'.repeat(openCount - closeCount);
              }

              let currentVal = math.evaluate(cleanTarget);
              if (Number.isFinite(currentVal)) {
                currentVal = currentVal * -1;
                expression = String(math.format(currentVal, { precision: 14 }));
              }
            } catch (err) {
              expression = `(-1)*(${expression})`;
            }
          } else {
            expression = '-';
          }
          renderButtons();
          updateMainDisplay(expression);
          break;

        case 'secondToggle':
          secondMode = !secondMode;
          renderButtons();
          break;
          
        case 'toggleDeg':
          isDeg = !isDeg;
          renderButtons();
          break;

        case 'memClear':
          memory = 0;
          renderButtons();
          break;
        
        case 'memAdd':
            try {
                const evalExpr = getParsedMathExpression(expression);
                const currentVal = evalExpr.trim() ? math.evaluate(evalExpr) : 0;
                if (Number.isFinite(currentVal)) {
                  memory += currentVal;
                  renderButtons();
                }
            } catch (e) {}
            break;

        case 'memSub':
            try {
                const evalExpr = getParsedMathExpression(expression);
                const currentVal = evalExpr.trim() ? math.evaluate(evalExpr) : 0;
                if (Number.isFinite(currentVal)) {
                  memory -= currentVal;
                  renderButtons();
                }
            } catch (e) {}
            break;

        case 'memRecall':
            if (hasEvaluated) {
              hasEvaluated = false;
              expression = '0';
            }
            if (expression === '0' || expression === '') {
                expression = String(memory);
            } else {
                const lastChar = expression.trim().slice(-1);
                if ('+-*/(^,'.includes(lastChar)) {
                  expression += String(memory);
                } else {
                  expression = String(memory);
                }
            }
            renderButtons();
            updateMainDisplay(expression);
            break;
      }
    }

    function tokenizeExpression(expr) {
        const TOKEN_DEFS = [
            { re: /^[0-9]+(?:\.[0-9]*)?[E][+-]?[0-9]+/, type: 'sciNotation' }, 
            { re: /^[0-9]+(?:\.[0-9]*)?[E]/,           type: 'sciNotation' }, 
            { re: /^pi/,                                type: 'const', latex: '\\pi' },
            { re: /^e/,                                 type: 'const', latex: 'e' }, 
            { re: /^[0-9]+(?:\.[0-9]*)?/,               type: 'num' },
            { re: /^nthRoot\(/,                         type: 'func_nthroot', latex: '\\sqrt' },
            { re: /^cbrt\(/,                            type: 'func_cbrt', latex: '\\sqrt[3]' },
            { re: /^sqrt\(/,                            type: 'func_sqrt', latex: '\\sqrt' },
            { re: /^ln\(/,                              type: 'func_ln', latex: '\\ln(' },
            { re: /^log10\(/,                           type: 'func_log10', latex: '\\log_{10}(' },
            { re: /^log2\(/,                            type: 'func_log2', latex: '\\log_{2}(' },
            { re: /^log\(/,                             type: 'func_logy', latex: '\\log(' },
            { re: /^[a-zA-Z_][a-zA-Z0-9_]*\(/,          type: 'func' },
            { re: /^\(/,                                type: 'open' },
            { re: /^\)/,                                type: 'close' },
            { re: /^,/,                                 type: 'comma' },
            { re: /^\*/,                                type: 'op', latex: '\\times ' },
            { re: /^\//,                                type: 'op', latex: '\\div ' },
            { re: /^[+\-^%!]/,                          type: 'op' },
            { re: /^./,                                 type: 'other' },
        ];

        const tokens = [];
        let rem = expr;
        while (rem.length) {
            let matched = false;
            for (const def of TOKEN_DEFS) {
                const m = rem.match(def.re);
                if (m) {
                    tokens.push({ type: def.type, raw: m[0], latex: def.latex });
                    rem = rem.slice(m[0].length);
                    matched = true;
                    break;
                }
            }
            if (!matched) { 
                tokens.push({ type: 'other', raw: rem[0] }); 
                rem = rem.slice(1); 
            }
        }
        return tokens;
    }

    function getParsedMathExpression(expr) {
        let s = expr;
        if (s.endsWith('^')) s = s.slice(0, -1);
        s = s.replace(/ln\(/g, 'log(');

        const tokens = tokenizeExpression(s);
        const CUR_VAL  = new Set(['num', 'const', 'close', 'sciNotation']);
        const NEXT_VAL = new Set(['num', 'const', 'func', 'func_sqrt', 'func_cbrt', 'func_nthroot', 'func_ln', 'func_log10', 'func_log2', 'func_logy', 'open', 'sciNotation']);

        const parts = [];
        for (let i = 0; i < tokens.length; i++) {
            const tok = tokens[i];
            
            if ((tok.type === 'func_logy' || tok.type === 'func_nthroot') && tok.raw.endsWith('(')) {
                let depth = 1, inner = '', j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type === 'open' || tokens[j].type.startsWith('func')) depth++;
                    if (tokens[j].type === 'close') depth--;
                    if (depth > 0) inner += tokens[j].raw;
                    j++;
                }
                const commaIdx = inner.indexOf(',');
                if (commaIdx !== -1) {
                    const arg1 = inner.substring(0, commaIdx);
                    const arg2 = inner.substring(commaIdx + 1);
                    parts.push(`${tok.raw.slice(0,-1)}(${arg2},${arg1})`);
                    i = j - 1;
                    continue;
                }
            }

            parts.push(tok.raw);
            if (i + 1 < tokens.length && CUR_VAL.has(tok.type) && NEXT_VAL.has(tokens[i+1].type)) {
                if (!(tok.type === 'num' && tokens[i+1].type === 'num')) {
                    parts.push('*'); 
                }
            }
        }

        let joined = parts.join('');
        // Force left-associative power evaluation to match UI and prevent Infinity on towers like 10^2^3^3
        let exponentTokens = [];
        let rem = joined;
        while (rem.length) {
            let mExp = rem.match(/^\^([a-zA-Z0-9_.,]+|\([^)]+\))/);
            if (mExp) {
                exponentTokens.push({ type: 'exp', val: mExp[1] });
                rem = rem.slice(mExp[0].length);
            } else {
                let mNormal = rem.match(/^([^^]+)/);
                if (mNormal) {
                    exponentTokens.push({ type: 'base', raw: mNormal[0] });
                    rem = rem.slice(mNormal[0].length);
                } else {
                    exponentTokens.push({ type: 'base', raw: rem[0] });
                    rem = rem.slice(1);
                }
            }
        }
        let processStr = "";
        for (let token of exponentTokens) {
            if (token.type === 'base') processStr += token.raw;
            else processStr = `(${processStr})^(${token.val})`;
        }
        return processStr;
    }

    function formatLatexExpression(expr) {
        let s = expr;
        if (s.endsWith('^')) s = s.slice(0, -1);

        const tokens = tokenizeExpression(s);
        const CUR_VAL  = new Set(['num', 'const', 'close', 'sciNotation']);
        const NEXT_VAL = new Set(['num', 'const', 'func', 'func_sqrt', 'func_cbrt', 'func_nthroot', 'func_ln', 'func_log10', 'func_log2', 'func_logy', 'open', 'sciNotation']);

        const parts = [];
        let i = 0;
        while (i < tokens.length) {
            const tok = tokens[i];

            if (tok.type === 'func_sqrt') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type === 'open' || tokens[j].type.startsWith('func')) depth++;
                    if (tokens[j].type === 'close') { depth--; }
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                parts.push(`\\sqrt{${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}}`);
                i = j;
                continue;
            }

            if (tok.type === 'func_cbrt') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type === 'open' || tokens[j].type.startsWith('func')) depth++;
                    if (tokens[j].type === 'close') { depth--; }
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                parts.push(`\\sqrt[3]{${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}}`);
                i = j;
                continue;
            }

            if (tok.type === 'func_nthroot') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type === 'open' || tokens[j].type.startsWith('func')) depth++;
                    if (tokens[j].type === 'close') { depth--; }
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                
                let commaIdx = innerRaw.indexOf(',');
                if (commaIdx !== -1) {
                    let indexRoot = innerRaw.substring(0, commaIdx);
                    let radicand = innerRaw.substring(commaIdx + 1);
                    parts.push(`\\sqrt[${indexRoot ? formatLatexExpression(indexRoot) : '\\phantom{i}'}]{${radicand ? formatLatexExpression(radicand) : '\\phantom{x}'}}`);
                } else {
                    parts.push(`\\sqrt[\\color{rgba(255,255,255,0.4)}{y}]{${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}}`);
                }

                i = j;
                continue;
            }

            if (tok.type === 'func_logy') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                let closed = false;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type === 'open' || tokens[j].type.startsWith('func')) depth++;
                    if (tokens[j].type === 'close') { depth--; if (depth === 0) closed = true; }
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                let commaIdx = innerRaw.indexOf(',');
                if (commaIdx !== -1) {
                    let base = innerRaw.substring(0, commaIdx);
                    let x = innerRaw.substring(commaIdx + 1);
                    parts.push(`\\log_{${base ? formatLatexExpression(base) : '\\phantom{b}'}}(${x ? formatLatexExpression(x) : '\\phantom{x}'}`);
                } else {
                    parts.push(`\\log(${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}`);
                }
                
                if (closed) parts.push(')');
                i = j;
                continue;
            }

            parts.push(tok.latex || tok.raw);
            if (i + 1 < tokens.length && CUR_VAL.has(tok.type) && NEXT_VAL.has(tokens[i+1].type)) {
                if (!(tok.type === 'num' && tokens[i+1].type === 'num')) {
                    parts.push('§GHOST§');
                }
            }
            i++;
        }
        s = parts.join('');

        let exponentTokens = [];
        let rem = s;
        while (rem.length) {
            let mExp = rem.match(/^\^([a-zA-Z0-9_.,\\]+|\{[^}]+\})/);
            if (mExp) {
                exponentTokens.push({ type: 'exp', raw: mExp[0], val: mExp[1] });
                rem = rem.slice(mExp[0].length);
            } else {
                let mNormal = rem.match(/^([^^]+)/);
                exponentTokens.push({ type: 'base', raw: mNormal[0] });
                rem = rem.slice(mNormal[0].length);
            }
        }

        let processStr = "";
        for (let token of exponentTokens) {
            if (token.type === 'base') {
                processStr += token.raw;
            } else {
                processStr = `({${processStr}})^{${token.val}}`;
            }
        }
        s = processStr;

        s = s.replace(/%/g, '\\%');

        s = s.replace(/([0-9.]+)[E]([+-]?\d+)/g, '$1\\times10^{$2}');
        s = s.replace(/([0-9.]+)[E]$/g, '$1\\times10^{\\phantom{0}}');

        const openCount  = (s.match(/\(/g) || []).length;
        const closeCount = (s.match(/\)/g) || []).length;
        if (openCount > closeCount) {
            s += '{\\color{rgba(255,255,255,0.22)}{)}}'.repeat(openCount - closeCount);
        }

        s = s.replace(/§GHOST_CLOSE§/g, '{\\color{rgba(255,255,255,0.22)}{)}}');
        s = s.replace(/§GHOST§/g, '{\\color{rgba(255,255,255,0.22)}{\\times}}');

        return s;
    }

    function adjustFontSize() {
      const targetElement = mainDisplay.querySelector('mjx-container');
      if (!targetElement) return;

      let defaultMaxFontSize = window.innerWidth <= 1520 ? 68 : 76;
      mainDisplay.style.fontSize = defaultMaxFontSize + 'px';

      const maxAllowedHeight = 154; 
      const minFontSize = 6; 
      let currentFontSize = defaultMaxFontSize;
      
      let innerWidth = targetElement.offsetWidth || targetElement.getBoundingClientRect().width;
      let innerHeight = targetElement.offsetHeight || targetElement.getBoundingClientRect().height;
      let maxAllowedWidth = mainDisplay.clientWidth;

      // Fix 1: Dynamically scales down ONLY when hitting the absolute right/left container edge
      while ((innerHeight > maxAllowedHeight || innerWidth >= maxAllowedWidth) && currentFontSize > minFontSize) {
        currentFontSize -= 1;
        mainDisplay.style.fontSize = currentFontSize + 'px';
        innerWidth = targetElement.offsetWidth || targetElement.getBoundingClientRect().width;
        innerHeight = targetElement.offsetHeight || targetElement.getBoundingClientRect().height;
      }
    }

    function updateMainDisplay(text) {
      mainDisplay.innerHTML = `$${formatLatexExpression(text)}$`;
      MathJax.typesetPromise([mainDisplay]).then(() => {
        adjustFontSize();
      });
    }

    function evaluateExpression() {
        if (!expression.trim()) return;

        try {
            let parsedExpression = getParsedMathExpression(expression);
            
            if (parsedExpression.endsWith('^')) {
              parsedExpression = parsedExpression.slice(0, -1);
            }

            // Fix 2: Auto-balances incomplete ghost brackets prior to arithmetic compilation
            const openCount = (parsedExpression.match(/\(/g) || []).length;
            const closeCount = (parsedExpression.match(/\)/g) || []).length;
            if (openCount > closeCount) {
              parsedExpression += ')'.repeat(openCount - closeCount);
            }

            if (isDeg) {
              parsedExpression = parsedExpression
                  .replace(/sin\(([^)]+)\)/g, 'sin($1 deg)')
                  .replace(/cos\(([^)]+)\)/g, 'cos($1 deg)')
                  .replace(/tan\(([^)]+)\)/g, 'tan($1 deg)');
            }

            const result = math.evaluate(parsedExpression);
            
            const formattedResult = Number.isFinite(result)
            ? math.format(result, { 
                notation: 'auto',
                precision: 14,
                lowerExp: -14, 
                upperExp: 14   
                })
            : result;

            subDisplay.innerHTML = `$${formatLatexExpression(expression)}$`;
            mainDisplay.innerHTML = `$${formatLatexExpression(String(formattedResult))}$`;

            expression = String(formattedResult);
            hasEvaluated = true; 
            renderButtons(); 

            MathJax.typesetPromise([subDisplay, mainDisplay]).then(() => {
               adjustFontSize();
               subDisplay.scrollLeft = subDisplay.scrollWidth;
            });
        } catch (err) {
            mainDisplay.innerHTML = '$\\text{Error}$';
            MathJax.typesetPromise([mainDisplay]).then(() => {
               adjustFontSize();
            });
        }
    }

    document.getElementById('scientificToggle').addEventListener('click', () => {
      scientificMode = !scientificMode;
      renderButtons();
      adjustFontSize();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Shift') {
        secondMode = true;
        renderButtons();
      }

      if (e.key === 'ArrowRight') {
        const openedCount = (expression.match(/\(/g) || []).length;
        const closedCount = (expression.match(/\)/g) || []).length;
        if (openedCount > closedCount) {
          expression += ')';
          updateMainDisplay(expression);
        }
      }

      if ((e.ctrlKey || e.metaKey || e.shiftKey) && (e.key === '=' || e.key === '+')) {
        if (e.key === '+' || e.shiftKey) {
          e.preventDefault(); 
        }
      }

      const allowed = '0123456789+-*/().%^,';
      if (allowed.includes(e.key)) {
        appendToExpression(e.key);
      }
      if (e.key === 'Enter') {
        evaluateExpression();
      }
      if (e.key === 'Backspace') {
        handleAction('backspace');
      }
      if (e.key === 'Escape') {
        handleAction('clear');
      }
    }, { passive: false });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Shift') {
        secondMode = false;
        renderButtons();
      }
    });

    renderButtons();
    updateMainDisplay('0');
  </script>
