<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Timezones</title>
    <style>
        * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .toolbar {
            background: #1d1d1e;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252528;
            z-index: 100;
        }

        .search-container {
            position: relative;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            width: 250px;
        }

        .search-container input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 13px;
            width: 100%;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            margin-top: 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .search-result { padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #2c2c2e; }
        .search-result:hover { background: #007aff; }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .clock-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        #heroTime { font-size: 64px; font-weight: 200; letter-spacing: -1px; }
        #heroDate { font-size: 14px; color: #007aff; font-weight: 600; text-transform: uppercase; margin-top: -5px; }
        #heroZone { font-size: 12px; color: #8e8e93; margin-top: 5px; }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            aspect-ratio: 150 / 65;
            background: #111;
            border-radius: 12px;
            border: 1px solid #222;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: crosshair;
        }

        .tooltip {
            position: fixed;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            pointer-events: none;
            font-size: 12px;
            display: none;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 11px;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display: flex; align-items: center; gap: 15px;">
        <div class="search-container">
            <input type="text" id="citySearch" placeholder="Search for a city (e.g. Tokyo)...">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <div style="font-size: 12px; color: #8e8e93;">Scroll to Zoom • Drag to Pan</div>
        <button class="legend-item" style="background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px;" onclick="resetView()">Reset View</button>
    </div>
</div>

<div class="content">
    <div class="clock-hero">
        <div id="heroDate">---</div>
        <div id="heroTime">00:00:00</div>
        <div id="heroZone">Loading local time...</div>
    </div>

    <div class="map-container" id="mapBox">
        <canvas id="mapCanvas"></canvas>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #007aff;"></div> Local Position</div>
        <div class="legend-item"><div class="dot" style="background: rgba(255,255,255,0.1);"></div> Night Area</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const citySearch = document.getElementById('citySearch');
    const searchResults = document.getElementById('searchResults');

    let width, height, markerPos = null, zoom = 1, offset = { x: 0, y: 0 };
    let mapImage = new Image();
    // Using the user-provided high-resolution Equirectangular map (15000x6500)
    mapImage.src = 'assets/map.png';

    // Sample City Database
    const cities = [
        { name: "New York", lat: 40.71, lon: -74.00 }, { name: "London", lat: 51.50, lon: -0.12 },
        { name: "Tokyo", lat: 35.68, lon: 139.69 }, { name: "Paris", lat: 48.85, lon: 2.35 },
        { name: "Dubai", lat: 25.20, lon: 55.27 }, { name: "Singapore", lat: 1.35, lon: 103.81 },
        { name: "Los Angeles", lat: 34.05, lon: -118.24 }, { name: "Hong Kong", lat: 22.31, lon: 114.16 },
        { name: "Sydney", lat: -33.86, lon: 151.20 }, { name: "Berlin", lat: 52.52, lon: 13.40 },
        { name: "Shanghai", lat: 31.23, lon: 121.47 }, { name: "Rome", lat: 41.90, lon: 12.49 },
        { name: "Moscow", lat: 55.75, lon: 37.61 }, { name: "Toronto", lat: 43.65, lon: -79.38 },
        { name: "Seoul", lat: 37.56, lon: 126.97 }, { name: "Chicago", lat: 41.87, lon: -87.62 },
        { name: "Mumbai", lat: 19.07, lon: 72.87 }, { name: "Madrid", lat: 40.41, lon: -3.70 },
        { name: "Mexico City", lat: 19.43, lon: -99.13 }, { name: "Bangkok", lat: 13.75, lon: 100.50 },
        { name: "Detroit", lat: 42.33, lon: -83.04 }
    ];

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        width = canvas.width;
        height = canvas.height;
        draw();
    }

    function getSunLongitude() {
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 0);
        const diff = now - startOfYear;
        const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
        const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
        
        // Subsolar point longitude is roughly -15 * (UTC time - 12)
        return -15 * (utcHours - 12);
    }

    function getSolarDeclination() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const day = Math.floor(diff / (1000 * 60 * 60 * 24));
        return 23.45 * Math.sin((Math.PI / 180) * (360 / 365) * (day + 284));
    }

    function lonToX(lon) { return ((lon + 180) / 360) * width; }
    // Recalibrated for the 15000x6500 map.
    // Width 360 deg / Height 156 deg = 2.307 ratio (matches 15000/6500).
    // Visual confirmation: This map is not centered; it starts at 90°N and is cropped at ~66°S.
    function latToY(lat) { return ((90 - lat) / 156) * height; }

    function screenToMap(sx, sy) {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        let x = (sx - rect.left) * dpr;
        let y = (sy - rect.top) * dpr;
        
        // Inverse of the draw() transformation:
        x = (x - width / 2) / zoom + width / 2 - offset.x;
        y = (y - height / 2) / zoom + height / 2 - offset.y;
        
        return { x, y };
    }

    function resetView() {
        zoom = 1;
        offset = { x: 0, y: 0 };
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        
        ctx.save();
        
        // Apply Camera Transformation
        ctx.translate(width / 2, height / 2);
        ctx.scale(zoom, zoom);
        // Center map and apply pan offset
        ctx.translate(-width / 2 + offset.x, -height / 2 + offset.y);

        // 1. Draw Background Map
        const dpr = window.devicePixelRatio || 1;
        ctx.globalAlpha = 0.85;
        ctx.filter = 'invert(0.9) brightness(1.8) contrast(1.4) grayscale(1)';
        ctx.drawImage(mapImage, 0, 0, width, height);
        ctx.filter = 'none';
        ctx.globalAlpha = 1.0;

        // 2. Draw Timezone Vertical Lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1 * dpr;
        for(let i = 0; i < 24; i++) {
            const x = (i / 24) * width;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }

        // 3. Sinusoidal Night Mask
        const sunLong = getSunLongitude();
        const declination = getSolarDeclination();
        const rad = Math.PI / 180;
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        // Iterate through longitudes to draw terminator curve
        for (let i = 0; i <= width; i += 2) {
            const lon = (i / width) * 360 - 180;
            // Terminator formula: tan(lat) = -cos(lon - sunLon) / tan(declination)
            const lat = Math.atan(-Math.cos((lon - sunLong) * rad) / Math.tan(declination * rad)) / rad;
            
            const y = latToY(lat);
            if (i === 0) ctx.moveTo(i, declination > 0 ? height : 0);
            ctx.lineTo(i, y);
        }
        ctx.lineTo(width, declination > 0 ? height : 0);
        ctx.lineTo(0, declination > 0 ? height : 0);
        ctx.fill();

        // 4. Draw marker if city searched
        if (markerPos) {
            ctx.fillStyle = '#007aff';
            ctx.shadowBlur = 10 * dpr;
            ctx.shadowColor = '#007aff';
            ctx.beginPath();
            ctx.arc(markerPos.x, markerPos.y, 4 * dpr, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    function updateClocks() {
        const now = new Date();
        document.getElementById('heroTime').textContent = now.toLocaleTimeString('en-US', { hour12: false });
        document.getElementById('heroDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        document.getElementById('heroZone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.replace('_', ' ');
        
        draw();
        requestAnimationFrame(updateClocks);
    }
    
    let isDragging = false, lastMouse = { x: 0, y: 0 };

    function handleMouseMove(e) {
        const mapPos = screenToMap(e.clientX, e.clientY);
        const x = mapPos.x;
        const y = mapPos.y;
        
        const lon = (x / width) * 360 - 180;
        const lat = 90 - (y / height) * 156;
        const offsetVal = Math.round(lon / 15);
        
        const time = new Date();
        time.setUTCHours(time.getUTCHours() + offsetVal);

        // Find closest city name for context
        const closest = cities.reduce((prev, curr) => 
            (Math.hypot(curr.lat - lat, curr.lon - lon) < Math.hypot(prev.lat - lat, prev.lon - lon)) ? curr : prev
        );
        
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 20) + 'px';
        tooltip.style.top = (e.clientY + 20) + 'px';
        tooltip.innerHTML = `
            <div style="font-weight:700; color:#007aff">${closest.name} Region (UTC ${offsetVal >= 0 ? '+' : ''}${offsetVal})</div>
            <div style="font-size:16px; margin:2px 0;">${time.getUTCHours().toString().padStart(2, '0')}:${time.getUTCMinutes().toString().padStart(2, '0')}</div>
            <div style="color:#8e8e93; font-size:10px;">POS: ${lat.toFixed(1)}°, ${lon.toFixed(1)}°</div>
        `;
    }

    canvas.onpointerdown = (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        lastMouse = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
        tooltip.style.display = 'none';
    };

    canvas.onpointermove = (e) => {
        if (isDragging) {
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            const dpr = window.devicePixelRatio || 1;
            
            offset.x += dx * dpr / zoom;
            offset.y += dy * dpr / zoom;
            
            lastMouse = { x: e.clientX, y: e.clientY };
            draw();
        } else {
            handleMouseMove(e);
        }
    };

    canvas.onpointerup = () => { isDragging = false; };

    canvas.onwheel = (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const nextZoom = Math.min(Math.max(zoom * delta, 1), 15);

        if (nextZoom !== zoom) {
            const px = (e.clientX - rect.left) * dpr;
            const py = (e.clientY - rect.top) * dpr;
            
            // Adjust offset to zoom toward mouse position
            offset.x += (px - width / 2) * (1 / nextZoom - 1 / zoom);
            offset.y += (py - height / 2) * (1 / nextZoom - 1 / zoom);
            
            zoom = nextZoom;
            draw();
        }
    };

    canvas.onmouseleave = () => tooltip.style.display = 'none';

    citySearch.oninput = (e) => {
        const val = e.target.value.toLowerCase();
        searchResults.innerHTML = '';
        if (!val) { searchResults.style.display = 'none'; return; }

        const matches = cities.filter(c => c.name.toLowerCase().includes(val));
        if (matches.length > 0) {
            searchResults.style.display = 'block';
            matches.forEach(city => {
                const div = document.createElement('div');
                div.className = 'search-result';
                div.textContent = city.name;
                div.onclick = () => {
                    markerPos = { x: lonToX(city.lon), y: latToY(city.lat) };
                    citySearch.value = city.name;
                    searchResults.style.display = 'none';
                    draw();
                };
                searchResults.appendChild(div);
            });
        } else {
            searchResults.style.display = 'none';
        }
    };

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) searchResults.style.display = 'none';
    });

    mapImage.onload = resize;
    window.onresize = resize;
    updateClocks();
</script>
</body>
</html>
