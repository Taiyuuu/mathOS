<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free-form Calculator</title>
    <!-- Import libraries -->
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>
    <style>
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background: #1d1d1e;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252528;
        }
        .radio-group { display: flex; gap: 10px; font-size: 11px; color: #aaa; }
        .radio-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        input[type="radio"], input[type="checkbox"] { accent-color: #007aff; cursor: pointer; }

        .editor-container {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            overflow-y: auto;
        }

        /* macOS Style Mathfield */
        math-field {
            width: 100%;
            max-width: 800px;
            font-size: 32px;
            background: #1a1a1c;
            color: white;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            --caret-color: #007aff;
            --selection-background-color: rgba(0, 122, 255, 0.3);
        }

        math-field:focus-within {
            border-color: #007aff;
            background: #202022;
        }

        .btn-calc {
            background: #007aff;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-calc:hover {
            background: #0a84ff;
            transform: scale(1.02);
        }

        .result-panel {
            width: 100%;
            max-width: 800px;
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 42px;
            font-weight: 300;
            color: #007aff;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="radio-group">
        <label style="margin-right: 10px; border-right: 1px solid #333; padding-right: 15px;">
            <input type="checkbox" id="radicalToggle"> Radical
        </label>
        <label><input type="radio" name="resFormat" value="decimal" checked> Decimal</label>
        <label><input type="radio" name="resFormat" value="fraction"> Fraction</label>
        <label><input type="radio" name="resFormat" value="percentage"> Percentage</label>
    </div>
    <button class="btn-calc" id="calculateBtn">Calculate</button>
</div>

<div class="editor-container">
    <math-field id="formula" placeholder="Type an expression...">
        1 + 2
    </math-field>

    <div id="resultPanel" class="result-panel">
        <div class="result-label">Result</div>
        <div id="resultValue" class="result-value"></div>
    </div>
</div>

<script>
    const mf = document.getElementById('formula');
    const calcBtn = document.getElementById('calculateBtn');
    const resultPanel = document.getElementById('resultPanel');
    const resultValue = document.getElementById('resultValue');
    const radicalToggle = document.getElementById('radicalToggle');

    function cleanValue(val) {
        if (!Number.isFinite(val)) return val;
        // Snap to integer if very close
        if (Math.abs(val - Math.round(val)) < 1e-9) return Math.round(val);
        
        // Smart rounding: Detect sequences of 00 or 99 to clean up numerical noise
        let s = math.format(val, { precision: 14, notation: 'fixed' });
        let dot = s.indexOf('.');
        if (dot !== -1) {
            let match = s.slice(dot + 1).match(/(99+|00+)/);
            if (match) return math.round(val, match.index);
        }
        return val;
    }

    function formatValue(val, type) {
        val = cleanValue(val);

        if (radicalToggle.checked && !Number.isInteger(val)) {
            const startA = Math.round(val) - 10;
            const endA = Math.round(val) + 10;
            for (let a = startA; a <= endA; a++) {
                const diff = val - a;
                const sq = cleanValue(diff * diff);
                try {
                    const f = math.fraction(sq);
                    if (f.d < 1000 && Math.abs(math.number(f) - sq) < 1e-8) {
                        if (f.n === 0) continue;
                        const inside = f.d === 1 ? f.n : `${f.n}/${f.d}`;
                        const radicalPart = `sqrt(${inside})`;
                        if (a === 0) return (diff < 0 ? "-" : "") + radicalPart;
                        return `${a} ${diff < 0 ? "-" : "+"} ${radicalPart}`;
                    }
                } catch(e) {}
            }
        }

        if (type === 'fraction') {
            try {
                const f = math.fraction(val);
                return (f.s < 0 ? '-' : '') + (f.d === 1 ? f.n : `${f.n}/${f.d}`);
            } catch(e) { /* fall back to decimal */ }
        } else if (type === 'percentage') {
            return math.format(val * 100, { precision: 10 }) + '%';
        }
        return math.format(val, { precision: 14, notation: 'auto', lowerExp: -12, upperExp: 12 });
    }

    function performCalculation() {
        const expression = mf.getValue('ascii-math');
        if (!expression.trim()) return;

        try {
            const result = math.evaluate(expression);
            const selectedFormat = document.querySelector('input[name="resFormat"]:checked').value;
            const formatted = formatValue(result, selectedFormat);

            resultValue.textContent = formatted;
            resultPanel.style.display = 'block';
            resultValue.style.color = '#007aff';
        } catch (e) {
            resultValue.textContent = 'Error';
            resultValue.style.color = '#ff5b60';
            resultPanel.style.display = 'block';
        }
    }

    calcBtn.onclick = performCalculation;

    mf.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            performCalculation();
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        // Explicitly set the fonts directory to resolve CDN loading/CORS issues
        if (window.MathfieldElement) {
            MathfieldElement.fontsDirectory = 'https://unpkg.com/mathlive/dist/fonts';
        }
        mf.focus();
    });
</script>
</body>
</html>
