<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grapher</title>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>
  <style>
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar {
      display: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: #1d1d1e;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #252528;
    }
    .input-wrapper {
      flex: 1;
      background: #2c2c31;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid #3a3a3d;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.2);
    }
    .prefix {
      color: #007aff;
      margin-right: 8px;
      font-weight: 600;
      font-size: 18px;
    }
    input {
      background: transparent;
      border: none;
      color: white;
      outline: none;
      width: 100%;
      font-size: 18px;
      font-family: "SF Mono", "Menlo", monospace;
    }
    .btn-action {
      background: #3a3a3d;
      border: 1px solid #4a4a4d;
      color: #eaeaea;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.2s;
    }
    .btn-action:hover { background: #444448; }
    #plotArea {
      flex: 1;
      position: relative;
      background-image: 
        radial-gradient(circle at 2px 2px, #111 1px, transparent 0);
      background-size: 40px 40px;
    }
    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="input-wrapper">
      <span class="prefix">y =</span>
      <input type="text" id="equationInput" placeholder="x^2" value="x^2" spellcheck="false">
    </div>
    <button class="btn-action" id="resetBtn">Center</button>
  </div>
  <div id="plotArea">
    <canvas id="graphCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('equationInput');
    const resetBtn = document.getElementById('resetBtn');

    let scale = 50; 
    let offset = { x: 0, y: 0 }; // Units relative to center

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      draw();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Use a consistent internal scale (Pixels Per Unit in the buffer)
      const viewScale = scale * dpr;
      const centerX = canvas.width / 2 + (offset.x * viewScale);
      const centerY = canvas.height / 2 - (offset.y * viewScale);

      // Dynamic tick spacing logic
      const targetDist = 80 * dpr;
      const rawStep = targetDist / viewScale;
      const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
      const resid = rawStep / mag;
      let step = resid < 2 ? 1 * mag : (resid < 5 ? 2 * mag : 5 * mag);
      if (!step || step <= 0) step = 1;

      // Axis Lines
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
      ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
      ctx.stroke();

      // Coordinates Ticks and Labels
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = `${11 * dpr}px SF Mono`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      // X-Axis
      let xStart = Math.ceil((-centerX) / (viewScale * step)) * step;
      for (let x = xStart; centerX + x * viewScale < canvas.width; x += step) {
        if (Math.abs(x) < step / 10) continue;
        const screenX = centerX + x * viewScale;
        ctx.beginPath();
        ctx.moveTo(screenX, centerY - 4 * dpr);
        ctx.lineTo(screenX, centerY + 4 * dpr);
        ctx.stroke();
        ctx.fillText(parseFloat(x.toPrecision(7)), screenX, centerY + 8 * dpr);
      }

      // Y-Axis
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      let yStart = Math.ceil((centerY - canvas.height) / (viewScale * step)) * step;
      for (let y = yStart; centerY - y * viewScale >= 0; y += step) {
        if (Math.abs(y) < step / 10) continue;
        const screenY = centerY - y * viewScale;
        if (screenY < 0) continue;
        ctx.beginPath();
        ctx.moveTo(centerX - 4 * dpr, screenY);
        ctx.lineTo(centerX + 4 * dpr, screenY);
        ctx.stroke();
        
        // Ensure label doesn't go off screen left
        const labelX = centerX - 8 * dpr;
        ctx.fillText(parseFloat(y.toPrecision(7)), labelX > 5 ? labelX : 5, screenY);
      }

      // Function Plot
      try {
        const expr = math.compile(input.value);
        ctx.strokeStyle = '#007aff';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.beginPath();

        let first = true;
        for (let i = 0; i <= canvas.width; i += 2) {
          const x = (i - centerX) / viewScale;
          try {
            const y = expr.evaluate({ x: x });
            const screenY = centerY - y * viewScale;
            
            if (isNaN(y) || !isFinite(y)) {
              first = true;
              continue;
            }

            if (first) { ctx.moveTo(i, screenY); first = false; }
            else { ctx.lineTo(i, screenY); }
          } catch (e) { first = true; }
        }
        ctx.stroke();
      } catch (e) {}
    }

    input.addEventListener('input', draw);
    resetBtn.onclick = () => {
      offset = { x: 0, y: 0 };
      scale = 50;
      draw();
    };

    window.addEventListener('resize', resize);
    // Ensure reliable resize even if the iframe window event is late
    new ResizeObserver(() => resize()).observe(document.body);
    
    let isDragging = false, lastPos = { x: 0, y: 0 };
    canvas.onpointerdown = (e) => { 
      if (e.button !== 0) return; // Only allow left-click to pan
      isDragging = true; 
      lastPos = { x: e.clientX, y: e.clientY }; 
      canvas.setPointerCapture(e.pointerId); 
    };

    canvas.onpointermove = (e) => {
      if (!isDragging) return;
      offset.x += (e.clientX - lastPos.x) / scale;
      offset.y -= (e.clientY - lastPos.y) / scale;
      lastPos = { x: e.clientX, y: e.clientY };
      draw();
    };
    canvas.onpointerup = () => isDragging = false;
    canvas.onwheel = (e) => { e.preventDefault(); const zoom = e.deltaY < 0 ? 1.1 : 0.9; scale *= zoom; draw(); };

    resize();
  </script>
</body>
</html>
