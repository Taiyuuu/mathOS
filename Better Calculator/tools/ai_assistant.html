<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @font-face {
            font-family: 'AI Assistant';
            src: url('assets/ai-assistant.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
        *::-webkit-scrollbar { display: none; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: white;
            font-family: 'AI Assistant', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .toolbar {
            background: #1d1d1e;
            padding: 10px 16px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #252528;
            z-index: 100;
        }

        .toolbar-group { display: flex; flex-direction: column; gap: 4px; }
        .label { font-size: 10px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

        input, select {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: white;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: #007aff; }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #111;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: #007aff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            align-self: center;
            background: transparent;
            color: #eee;
            border: none;
            text-align: center;
            width: 100%;
            max-width: 90%;
            animation: revealDown 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .ai-message pre {
            background: #000;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: "SF Mono", Menlo, monospace;
            font-size: 12px;
            border: 1px solid #333;
        }

        @keyframes revealDown {
            from { clip-path: inset(0 0 100% 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        .input-area {
            padding: 16px;
            background: #1d1d1e;
            border-top: 1px solid #252528;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: white;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 200px;
        }
        textarea:focus { border-color: #007aff; }

        .btn-send {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .btn-send:hover { background: #0a84ff; transform: scale(1.05); }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-toolbar {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #007aff;
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-toolbar:hover { background: #3a3a3c; border-color: #007aff; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="toolbar-group">
        <span class="label">Gemini API Key</span>
        <input type="password" id="apiKey" placeholder="Paste key here...">
    </div>
    <div class="toolbar-group">
        <span class="label">Model</span>
        <select id="modelSelect">
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
        </select>
    </div>
    <div class="toolbar-group" style="margin-left: auto;">
        <span class="label">External</span>
        <button class="btn-toolbar" onclick="window.open('https://gemini.google.com', '_blank')">Gemini Web</button>
    </div>
</div>

<div class="chat-container" id="chatContainer">
    <div class="message ai-message">Hello! I'm your Gemini AI assistant. Enter your API key above to start chatting.</div>
</div>

<div class="input-area">
    <textarea id="userInput" placeholder="Ask me anything..." rows="1"></textarea>
    <button class="btn-send" id="sendBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
</div>

<script>
    let chatHistory = [];
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const apiKeyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('modelSelect');

    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    modelSelect.value = localStorage.getItem('gemini_model') || 'gemini-3.5-flash';

    apiKeyInput.onchange = () => localStorage.setItem('gemini_api_key', apiKeyInput.value);
    modelSelect.onchange = () => localStorage.setItem('gemini_model', modelSelect.value);

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        if (!text || !apiKey || sendBtn.disabled) return;

        addMessage(text, 'user');
        // Add user message to history
        chatHistory.push({ role: 'user', parts: [{ text: text }] });

        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        const thinkingDiv = showThinking();
        
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelSelect.value}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: chatHistory })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            
            const aiResponse = data.candidates[0].content.parts[0].text;
            // Add model response to history
            chatHistory.push({ role: 'model', parts: [{ text: aiResponse }] });
            
            thinkingDiv.remove();
            const aiMsgDiv = addMessage('', 'ai');
            aiMsgDiv.innerHTML = marked.parse(aiResponse);
        } catch (error) {
            thinkingDiv.remove();
            const aiMsgDiv = addMessage('', 'ai');
            aiMsgDiv.textContent = 'Error: ' + error.message;
            aiMsgDiv.style.color = '#ff5b60';
            chatHistory.pop(); // Remove failed user prompt from history
        } finally {
            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }

    function showThinking() {
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.flexDirection = 'column';
        div.style.alignItems = 'center';
        div.style.gap = '8px';
        div.style.padding = '20px';
        div.innerHTML = `
            <img src="assets/ai-thinking.gif" style="width: 48px; height: 48px; opacity: 0.8;">
            <span style="font-size: 11px; color: #8e8e93; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Thinking</span>
        `;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    function addMessage(content, role) {
        const div = document.createElement('div');
        div.className = `message ${role}-message`;
        div.textContent = content;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
</script>
</body>
</html>
