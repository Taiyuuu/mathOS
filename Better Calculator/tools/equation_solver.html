<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equation Solver</title>
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>
    <style>
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            background: #1d1d1e;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252528;
        }
        .controls { display: flex; gap: 15px; align-items: center; }
        .control-label { font-size: 11px; color: #aaa; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .radio-group { display: flex; gap: 10px; font-size: 11px; color: #aaa; }
        .radio-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        input[type="radio"], input[type="checkbox"] { accent-color: #007aff; cursor: pointer; }

        .editor-container {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            overflow-y: auto;
        }
        .equation-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }
        .btn-remove {
            background: #ff5b60;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            opacity: 0.7;
            transition: 0.2s;
        }
        .btn-remove:hover { opacity: 1; }

        math-field {
            flex: 1;
            font-size: 32px;
            background: #1a1a1c;
            color: white;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            --caret-color: #007aff;
            --selection-background-color: rgba(0, 122, 255, 0.3);
        }
        math-field:focus-within {
            border-color: #007aff;
            background: #202022;
        }
        .btn-solve {
            background: #007aff;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-solve:hover {
            background: #0a84ff;
            transform: scale(1.02);
        }
        .result-panel {
            width: 100%;
            max-width: 800px;
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-value {
            font-size: 36px;
            font-weight: 300;
            color: #007aff;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <div class="controls">
        <button class="btn-solve" style="background: #3a3a3d;" id="addBtn">+ Equation</button>
        <label class="control-label"><input type="checkbox" id="multiSolutionToggle"> All Solutions</label>
        <label class="control-label"><input type="checkbox" id="wholeNumberToggle"> Whole Numbers Only</label>
        <label class="control-label"><input type="checkbox" id="radicalToggle"> Radical</label>
        <div class="radio-group">
            <label><input type="radio" name="resFormat" value="decimal" checked> Dec</label>
            <label><input type="radio" name="resFormat" value="fraction"> Frac</label>
            <label><input type="radio" name="resFormat" value="percentage"> %</label>
        </div>
    </div>
    <button class="btn-solve" id="solveBtn">Solve</button>
</div>
<div class="editor-container" id="editorContainer">
    <div class="equation-row">
        <math-field placeholder="Enter equation (e.g., 2x + 5 = 15)...">2x + 5 = 15</math-field>
    </div>
    <div id="resultPanel" class="result-panel">
        <div class="result-label">Result</div>
        <div id="resultValue" class="result-value"></div>
    </div>
</div>
<script>
    const editorContainer = document.getElementById('editorContainer');
    const addBtn = document.getElementById('addBtn');
    const solveBtn = document.getElementById('solveBtn');
    const resultPanel = document.getElementById('resultPanel');
    const resultValue = document.getElementById('resultValue');
    const multiSolutionToggle = document.getElementById('multiSolutionToggle');
    const wholeNumberToggle = document.getElementById('wholeNumberToggle');
    const radicalToggle = document.getElementById('radicalToggle');

    function cleanValue(val) {
        if (!Number.isFinite(val)) return val;
        // Snap to integer if very close
        if (Math.abs(val - Math.round(val)) < 1e-9) return Math.round(val);
        
        // Smart rounding: Detect sequences of 00 or 99 to clean up numerical noise
        let s = math.format(val, { precision: 14, notation: 'fixed' });
        let dot = s.indexOf('.');
        if (dot !== -1) {
            let match = s.slice(dot + 1).match(/(99+|00+)/);
            if (match) return math.round(val, match.index);
        }
        return val;
    }

    function formatValue(val, type) {
        val = cleanValue(val);

        if (radicalToggle.checked && !Number.isInteger(val)) {
            const startA = Math.round(val) - 10;
            const endA = Math.round(val) + 10;
            for (let a = startA; a <= endA; a++) {
                const diff = val - a;
                const sq = cleanValue(diff * diff);
                try {
                    const f = math.fraction(sq);
                    if (f.d < 1000 && Math.abs(math.number(f) - sq) < 1e-8) {
                        if (f.n === 0) continue;
                        const inside = f.d === 1 ? f.n : `${f.n}/${f.d}`;
                        const radicalPart = `sqrt(${inside})`;
                        if (a === 0) return (diff < 0 ? "-" : "") + radicalPart;
                        return `${a} ${diff < 0 ? "-" : "+"} ${radicalPart}`;
                    }
                } catch(e) {}
            }
        }

        if (type === 'fraction') {
            try {
                const f = math.fraction(val);
                return (f.s < 0 ? '-' : '') + (f.d === 1 ? f.n : `${f.n}/${f.d}`);
            } catch(e) { /* fall back to decimal */ }
        } else if (type === 'percentage') {
            return math.format(val * 100, { precision: 10 }) + '%';
        }
        return math.format(val, { precision: 10, notation: 'auto', lowerExp: -12, upperExp: 12 });
    }

    addBtn.onclick = () => {
        const row = document.createElement('div');
        row.className = 'equation-row';
        row.innerHTML = `
            <math-field placeholder="Next equation..."></math-field>
            <button class="btn-remove">×</button>
        `;
        editorContainer.insertBefore(row, resultPanel);
        const mf = row.querySelector('math-field');
        mf.focus();
        row.querySelector('.btn-remove').onclick = () => row.remove();
    };

    function performSolve() {
        const mfs = Array.from(editorContainer.querySelectorAll('math-field'));
        const equations = mfs.map(mf => mf.getValue('ascii-math').trim()).filter(s => s);
        if (equations.length === 0) return;

        const selectedFormat = document.querySelector('input[name="resFormat"]:checked').value;

        try {
            const preprocess = (eq) => {
                let expr = eq;
                if (eq.includes('=')) {
                    const [lhs, rhs] = eq.split('=');
                    expr = `(${lhs}) - (${rhs})`;
                }
                try {
                    let node = math.parse(expr);
                    let transformed = node.transform(function (node) {
                        // Look for functions starting with log_ (e.g., log_2(x))
                        if (node.type === 'FunctionNode' && node.fn && typeof node.fn.name === 'string' && node.fn.name.startsWith('log_')) {
                            const baseStr = node.fn.name.substring(4);
                            const baseNode = math.parse(baseStr);
                            const argumentNode = node.args[0];
                            
                            // Convert log_b(a) into standard OperatorNode: log(a) / log(b)
                            // math.js derivative handles single-argument log and regular division cleanly!
                            return new math.OperatorNode('/', 'divide', [
                                new math.FunctionNode('log', [argumentNode]),
                                new math.FunctionNode('log', [baseNode])
                            ]);
                        }
                        return node;
                    });
                    return transformed.toString();
                } catch (e) { return expr; }
            };

            const f_exprs = equations.map(preprocess);

            const symbols = new Set();
            f_exprs.forEach(expr => {
                try {
                    math.parse(expr).traverse((node, path, parent) => {
                        if (node.isSymbolNode) {
                            const name = node.name;
                            if (['pi', 'e', 'i'].includes(name)) return;
                            if (math[name]) return;
                            if (parent && parent.type === 'FunctionNode' && parent.fn === node) return;
                            symbols.add(name);
                        }
                    });
                } catch(e) {}
            });
            const allVars = Array.from(symbols);
            const hasEquals = equations.some(eq => eq.includes('='));

            // Check for identities or contradictions (e.g., 0=0 or 5=0)
            if (f_exprs.length === 1 && allVars.length > 0) {
                try {
                    const simplified = math.simplify(f_exprs[0]);
                    if (simplified.isConstantNode) {
                        const val = simplified.evaluate();
                        if (Math.abs(val) < 1e-11) {
                            resultValue.textContent = "Infinite solutions";
                            resultPanel.style.display = 'block';
                            resultValue.style.color = '#007aff';
                            return;
                        } else {
                            throw new Error("No solution found");
                        }
                    }
                } catch(e) {
                    if (e.message === "No solution found") throw e;
                }
            }

            if (!hasEquals && equations.length === 1) {
                try {
                    const evaled = math.evaluate(f_exprs[0]);
                    if (typeof evaled === 'number') {
                        if (wholeNumberToggle.checked && Math.abs(evaled - Math.round(evaled)) > 1e-6) {
                            throw new Error("Not a whole number");
                        }
                        resultValue.textContent = formatValue(evaled, selectedFormat);
                    } else {
                        resultValue.textContent = math.simplify(f_exprs[0]).toString();
                    }
                } catch(e) {
                    if (e.message.includes("whole")) throw e;
                    resultValue.textContent = math.simplify(f_exprs[0]).toString();
                }
            } else {
                const n = allVars.length;
                if (n === 0) {
                    const evaled = math.evaluate(f_exprs[0]);
                    if (wholeNumberToggle.checked && Math.abs(evaled - Math.round(evaled)) > 1e-6) {
                        throw new Error("Not a whole number");
                    }
                    resultValue.textContent = formatValue(evaled, selectedFormat);
                } else if (f_exprs.length < n) {
                    throw new Error("Underdetermined");
                } else {
                    // Newton-Raphson Numerical Solver
                    const findSolutions = (startGuess) => {
                        let currentGuess = [...startGuess];
                        let converged = false;
                        for (let iter = 0; iter < 100; iter++) {
                            const scope = {};
                            allVars.forEach((v, idx) => scope[v] = currentGuess[idx]);
                            try {
                                const F = f_exprs.map(expr => math.evaluate(expr, scope));
                                if (F.every(v => Math.abs(v) < 1e-24)) { converged = true; break; }

                                const J = [];
                                for (let i = 0; i < n; i++) {
                                    const row = [];
                                    for (let j = 0; j < n; j++) {
                                        const deriv = math.derivative(f_exprs[i], allVars[j]).evaluate(scope);
                                        row.push(deriv);
                                    }
                                    J.push(row);
                                }
                                const delta = math.lusolve(J, F.map(v => -v));
                                allVars.forEach((v, idx) => {
                                    const step = delta[idx][0];
                                    currentGuess[idx] += step;
                                });
                                if (Math.max(...delta.map(d => Math.abs(d[0]))) < 1e-18) { converged = true; break; }
                            } catch (e) {
                                currentGuess = currentGuess.map(v => v + (Math.random() - 0.5) * 10);
                            }
                        }
                        return converged ? currentGuess : null;
                    };

                    let uniqueSolutions = [];
                    const attempts = multiSolutionToggle.checked ? 40 : 10;
                    
                    for (let i = 0; i < attempts; i++) {
                        let start;
                        if (i === 0) start = allVars.map(() => 0);
                        else if (i === 1) start = allVars.map(() => 1);
                        else if (i === 2) start = allVars.map(() => -1);
                        // Start some guesses further out to assist logarithmic domain discovery
                        else if (i === 3) start = allVars.map(() => 5); 
                        else start = allVars.map(() => (Math.random() - 0.5) * 100);
                        
                        const sol = findSolutions(start);
                        if (sol) {
                            const cleanedSol = sol.map(v => cleanValue(v));
                            if (wholeNumberToggle.checked) {
                                const isWhole = cleanedSol.every(val => Math.abs(val - Math.round(val)) < 1e-6);
                                if (!isWhole) continue;
                            }

                            const isDuplicate = uniqueSolutions.some(existing => 
                                cleanedSol.every((val, idx) => Math.abs(val - existing[idx]) < 1e-7)
                            );
                            if (!isDuplicate) uniqueSolutions.push(cleanedSol);
                            if (!multiSolutionToggle.checked) break;
                        }
                    }

                    if (uniqueSolutions.length === 0) throw new Error(wholeNumberToggle.checked ? "No whole number solution found" : "No convergence");
                    
                    const formattedSolutions = uniqueSolutions.map(sol => {
                        return allVars.map((v, i) => `${v} = ${formatValue(sol[i], selectedFormat)}`).join(', ');
                    });

                    if (formattedSolutions.length > 1) {
                        resultValue.innerHTML = formattedSolutions.map(s => `<div style="margin-bottom:8px; border-bottom:1px solid #222; padding-bottom:4px;">${s}</div>`).join('');
                        resultValue.style.fontSize = '24px';
                    } else {
                        resultValue.textContent = formattedSolutions[0];
                        resultValue.style.fontSize = '36px';
                    }
                }
            }
            resultPanel.style.display = 'block';
            resultValue.style.color = '#007aff';
        } catch (e) {
            resultValue.textContent = (e.message === "Underdetermined") ? "More variables than equations" : 
                                      (e.message === "No solution found") ? "No solution found" :
                                      (e.message.includes("whole") ? e.message : 
                                      "No convergence or no solution found");
            resultValue.style.color = '#ff5b60';
            resultPanel.style.display = 'block';
        }
    }
    solveBtn.onclick = performSolve;
    editorContainer.addEventListener('keydown', (e) => { 
        if (e.key === 'Enter' && e.target.tagName === 'MATH-FIELD') { 
            e.preventDefault(); 
            performSolve(); 
        } 
    });
    window.addEventListener('DOMContentLoaded', () => {
        const firstMf = editorContainer.querySelector('math-field');
        if (firstMf) firstMf.focus();
    });
</script>
</body>
</html>
