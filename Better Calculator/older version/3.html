<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>macOS Calculator</title>

  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .calculator {
      width: 1480px;
      background: #1d1d1e;
      border-radius: 34px;
      border: 1px solid #252528;
      padding: 18px;
      position: relative;
      
      /* Subdued Outer Body Framing: Barely visible glass paths */
      box-shadow:
        inset 1px 1px 0 0 rgba(255, 255, 255, 0.3),     /* Faint Top-Left */
        inset -1px -1px 0 0 rgba(255, 255, 255, 0.12),   /* Barely there Bottom-Right */
        0 25px 50px rgba(0, 0, 0, 0.6);
      transition: width 0.25s ease;
    }

    .calculator.basic-mode {
      width: 500px;
    }

    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .traffic {
      display: flex;
      gap: 14px;
      padding-left: 6px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .red { background: #ff5b60; }
    .yellow { background: #fac803; }
    .gray { background: #434345; }

    .toggle-area {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .mode-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: #2c2c31;
      color: #eaeaea;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.15s ease;
      font-size: 26px;
      
      box-shadow: 
        inset 1px 1px 0 rgba(255, 255, 255, 0.12),
        inset -1px -1px 0 rgba(255, 255, 255, 0.04);
    }

    .mode-btn:hover {
      transform: scale(1.04);
    }

    .display {
      height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 8px 10px 22px;
      overflow: hidden;
    }

    .sub-display {
      min-height: 34px;
      font-size: 26px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 14px;
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }
    .sub-display::-webkit-scrollbar { display: none; }

    .main-display {
      font-size: 82px;
      font-weight: 300;
      line-height: 1;
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }
    .main-display::-webkit-scrollbar { display: none; }

    .buttons {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 12px;
    }

    .calculator.basic-mode .buttons {
      grid-template-columns: repeat(4, 1fr);
    }

    /* Core Button: Tone adjusted down significantly */
    .btn {
      height: 102px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 34px;
      color: #fffbf3;
      /* Very gentle gradient to native surface */
      background: #505051;
      transition: 0.12s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0 10px;
      
      /* ADJUST HERE: Softened liquid glass shadows using small opacities */
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.12),     /* Soft Top-Left spec light */
        inset -1.5px -1.5px 1px rgba(255, 255, 255, 0.04),/* Near-invisible Bottom-Right return bounce */
        0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    /* Utility Row (Gray keys) */
    .btn.light {
      background: #7c7c7d;
      font-weight: 500;
      
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.3),     /* Softened Top-Left */
        inset -1px -1px 1px rgba(255, 255, 255, 0.1),    /* Softened Bottom-Right */
        0 2px 4px rgba(0, 0, 0, 0.12);
    }

    /* Operators Row (Orange keys) */
    .btn.orange {
      background: #ff9b00;
      
      box-shadow: 
        inset 1px 1px 1px rgba(255, 255, 255, 0.36),     /* Softened Top-Left */
        inset -1px -1px 1px rgba(255, 255, 255, 0.08),    /* Softened Bottom-Right */
        0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .btn.scientific-only {
      background: #363637;
    }

    .btn.active-toggle {
      background: #666667;
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 1520px) {
      .calculator:not(.basic-mode) { width: 96vw; }
      .btn { height: 86px; font-size: 28px; }
      .main-display { font-size: 68px; }
    }

    @media (max-width: 980px) {
      .calculator:not(.basic-mode) { width: 520px; }
      .display { height: 170px; }
      .main-display { font-size: 64px; }
      .calculator:not(.basic-mode) .buttons { grid-template-columns: repeat(4, 1fr); }
      .scientific-only { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="calculator scientific-mode" id="calcContainer">
    <div class="titlebar">
      <div class="traffic">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot gray"></div>
      </div>

      <div class="toggle-area">
        <button class="mode-btn" id="scientificToggle">⌘</button>
      </div>
    </div>

    <div class="display">
      <div class="sub-display" id="subDisplay"></div>
      <div class="main-display" id="mainDisplay">0</div>
    </div>

    <div class="buttons" id="buttons"></div>
  </div>

  <script>
    const buttonsContainer = document.getElementById('buttons');
    const calcContainer = document.getElementById('calcContainer');
    const mainDisplay = document.getElementById('mainDisplay');
    const subDisplay = document.getElementById('subDisplay');

    let expression = '';
    let scientificMode = true;
    let secondMode = false;
    let isDeg = false; 
    let memory = 0;
    let hasEvaluated = false; 

    function getScientificButtons() {
      return [
        [
          { latex: '(', value: '(' },
          { latex: ')', value: ')' },
          { latex: 'mc', action: 'memClear' },  
          { latex: 'm+', action: 'memAdd' },    
          { latex: 'm-', action: 'memSub' },    
          { latex: 'mr', action: 'memRecall', class: memory !== 0 ? 'active-toggle' : '' }, 
        ],
        [
          { latex: '2^{nd}', action: 'secondToggle', class: secondMode ? 'active-toggle' : '' },
          { latex: 'x^2', value: '^2' },
          { latex: 'x^3', value: '^3' },
          { latex: 'x^y', value: '^' },
          { latex: secondMode ? 'y^x' : 'e^x', value: secondMode ? '^' : 'exp(' },
          { latex: secondMode ? '2^x' : '10^x', value: secondMode ? '2^' : '10^' }
        ],
        [
          { latex: '\\frac{1}{x}', value: '1/' },
          { latex: '\\sqrt[2]{x}', value: 'sqrt(' },
          { latex: '\\sqrt[3]{x}', value: 'cbrt(' },
          { latex: '\\sqrt[y]{x}', value: 'nthRoot(' },
          { latex: secondMode ? '\\log_y' : '\\ln', value: secondMode ? 'log(' : 'ln(' },
          { latex: secondMode ? '\\log_2' : '\\log_{10}', value: secondMode ? 'log2(' : 'log10(' }
        ],
        [
          { latex: 'x!', value: '!' },
          { latex: secondMode ? '\\sin^{-1}' : '\\sin', value: secondMode ? 'asin(' : 'sin(' },
          { latex: secondMode ? '\\cos^{-1}' : '\\cos', value: secondMode ? 'acos(' : 'cos(' },
          { latex: secondMode ? '\\tan^{-1}' : '\\tan', value: secondMode ? 'atan(' : 'tan(' },
          { latex: 'e', value: 'e' },
          { latex: 'EE', value: 'E' } 
        ],
        [
          { latex: 'Rand', action: 'generateRandom' }, 
          { latex: secondMode ? '\\sinh^{-1}' : '\\sinh', value: secondMode ? 'asinh(' : 'sinh(' },
          { latex: secondMode ? '\\cosh^{-1}' : '\\cosh', value: secondMode ? 'acosh(' : 'cos(' },
          { latex: secondMode ? '\\tanh^{-1}' : '\\tanh', value: secondMode ? 'atanh(' : 'tanh(' },
          { latex: '\\pi', value: 'pi' },
          { latex: isDeg ? 'Deg' : 'Rad', action: 'toggleDeg' }
        ]
      ];
    }

    function getCoreButtons() {
      const clearLabel = (expression === '' || expression === '0') ? 'AC' : 'C';
      return [
        [
          { latex: '\\boxed{\\times}', action: 'backspace', class: 'light' },
          { latex: clearLabel, action: 'clear', class: 'light' },
          { latex: '\\%', value: '%', class: 'light' },
          { latex: '\\div', value: '/', class: 'orange' }
        ],
        [
          { latex: '7', value: '7' },
          { latex: '8', value: '8' },
          { latex: '9', value: '9' },
          { latex: '\\times', value: '*', class: 'orange' }
        ],
        [
          { latex: '4', value: '4' },
          { latex: '5', value: '5' },
          { latex: '6', value: '6' },
          { latex: '-', value: '-', class: 'orange' }
        ],
        [
          { latex: '1', value: '1' },
          { latex: '2', value: '2' },
          { latex: '3', value: '3' },
          { latex: '+', value: '+', class: 'orange' }
        ],
        [
          { latex: '\\pm', action: 'negate' },
          { latex: '0', value: '0' },
          { latex: '.', value: '.' },
          { latex: '=', action: 'evaluate', class: 'orange' }
        ]
      ];
    }

    function createButton(btnData, extraClass = '') {
      const button = document.createElement('button');
      button.className = `btn ${btnData.class || ''} ${extraClass}`;
      button.innerHTML = `$${btnData.latex}$`;

      button.addEventListener('click', () => {
        if (btnData.action) {
          handleAction(btnData.action);
        } else if (btnData.value !== undefined) {
          appendToExpression(btnData.value);
        }
      });

      return button;
    }

    function renderButtons() {
      buttonsContainer.innerHTML = '';
      const coreButtons = getCoreButtons();

      if (scientificMode) {
        calcContainer.classList.remove('basic-mode');
        calcContainer.classList.add('scientific-mode');
        const sciButtons = getScientificButtons();
        
        for (let row = 0; row < 5; row++) {
          sciButtons[row].forEach(btn => {
            const button = createButton(btn, 'scientific-only');
            buttonsContainer.appendChild(button);
          });

          coreButtons[row].forEach(btn => {
            const button = createButton(btn);
            buttonsContainer.appendChild(button);
          });
        }
      } else {
        calcContainer.classList.remove('scientific-mode');
        calcContainer.classList.add('basic-mode');
        
        coreButtons.forEach(row => {
          row.forEach(btn => {
            const button = createButton(btn);
            buttonsContainer.appendChild(button);
          });
        });
      }

      MathJax.typesetClear([buttonsContainer]);
      MathJax.typesetPromise([buttonsContainer]);
    }

    function appendToExpression(value) {
      if (hasEvaluated) {
        hasEvaluated = false;
        const incomingIsOperator = /^[+\-*\/^%,]/;
        if (!incomingIsOperator.test(value)) {
          expression = '0';
        }
      }

      const incomingIsOperator = /^[+\-*\/^%,]/;
      if (expression === '0' && !incomingIsOperator.test(value) && value !== '.' && value !== ',') {
        expression = value;
      } else {
        expression += value;
      }
      renderButtons();
      updateMainDisplay(expression);
    }

    function handleAction(action) {
      switch(action) {
        case 'clear':
          hasEvaluated = false;
          if (expression !== '' && expression !== '0') {
            const matchToken = expression.match(/([a-zA-Z0-9_]+\()|([0-9.]+[E][+-]?[0-9]*)|([0-9.]+)|([E][+-]?[0-9]*)|([+\-*/%^(),e]|\bpi\b)/g);
            if (matchToken && matchToken.length > 0) {
              matchToken.pop(); 
              expression = matchToken.join('');
            } else {
              expression = '';
            }
            if (expression === '') expression = '0';
          } else {
            expression = '';
            subDisplay.innerHTML = '';
          }
          renderButtons();
          updateMainDisplay(expression || '0');
          break;

        case 'backspace':
          hasEvaluated = false;
          expression = expression.slice(0, -1);
          renderButtons();
          updateMainDisplay(expression || '0');
          break;

        case 'evaluate':
          evaluateExpression();
          break;

        case 'generateRandom':
          try {
            const randVal = math.random();
            expression = String(math.format(randVal, { precision: 14 }));
            hasEvaluated = true; 
            renderButtons();
            updateMainDisplay(expression);
          } catch (e) {
            expression = '0';
            updateMainDisplay(expression);
          }
          break;

        case 'negate':
          hasEvaluated = false;
          if (expression && expression !== '0') {
            try {
              let cleanTarget = getParsedMathExpression(expression);
              if (cleanTarget.endsWith('^')) cleanTarget = cleanTarget.slice(0, -1);
              
              const openCount = (cleanTarget.match(/\(/g) || []).length;
              const closeCount = (cleanTarget.match(/\(/g) || []).length;
              if (openCount > closeCount) {
                cleanTarget += ')'.repeat(openCount - closeCount);
              }

              let currentVal = math.evaluate(cleanTarget);
              if (Number.isFinite(currentVal)) {
                currentVal = currentVal * -1;
                expression = String(math.format(currentVal, { precision: 14 }));
              }
            } catch (err) {
              expression = `(-1)*(${expression})`;
            }
          } else {
            expression = '-';
          }
          renderButtons();
          updateMainDisplay(expression);
          break;

        case 'secondToggle':
          secondMode = !secondMode;
          renderButtons();
          break;
          
        case 'toggleDeg':
          isDeg = !isDeg;
          renderButtons();
          break;

        case 'memClear':
          memory = 0;
          renderButtons();
          break;
        
        case 'memAdd':
            try {
                const evalExpr = getParsedMathExpression(expression);
                const currentVal = evalExpr.trim() ? math.evaluate(evalExpr) : 0;
                if (Number.isFinite(currentVal)) {
                  memory += currentVal;
                  renderButtons();
                }
            } catch (e) {}
            break;

        case 'memSub':
            try {
                const evalExpr = getParsedMathExpression(expression);
                const currentVal = evalExpr.trim() ? math.evaluate(evalExpr) : 0;
                if (Number.isFinite(currentVal)) {
                  memory -= currentVal;
                  renderButtons();
                }
            } catch (e) {}
            break;

        case 'memRecall':
            if (hasEvaluated) {
              hasEvaluated = false;
              expression = '0';
            }
            if (expression === '0' || expression === '') {
                expression = String(memory);
            } else {
                const lastChar = expression.trim().slice(-1);
                if ('+-*/(^,'.includes(lastChar)) {
                  expression += String(memory);
                } else {
                  expression = String(memory);
                }
            }
            renderButtons();
            updateMainDisplay(expression);
            break;
      }
    }

    function tokenizeExpression(expr) {
        const TOKEN_DEFS = [
            { re: /^[0-9]+(?:\.[0-9]*)?[E][+-]?[0-9]+/, type: 'sciNotation' }, 
            { re: /^[0-9]+(?:\.[0-9]*)?[E]/,           type: 'sciNotation' }, 
            { re: /^pi/,                                type: 'const', latex: '\\pi' },
            { re: /^e/,                                 type: 'const', latex: 'e' }, 
            { re: /^[0-9]+(?:\.[0-9]*)?/,               type: 'num' },
            { re: /^nthRoot\(/,                         type: 'func_nthroot', latex: '\\sqrt' },
            { re: /^cbrt\(/,                            type: 'func_cbrt', latex: '\\sqrt[3]' },
            { re: /^sqrt\(/,                            type: 'func_sqrt', latex: '\\sqrt' },
            { re: /^ln\(/,                              type: 'func_ln', latex: '\\ln\\big(' },
            { re: /^log10\(/,                           type: 'func_log10', latex: '\\log_{10}\\big(' },
            { re: /^log2\(/,                            type: 'func_log2', latex: '\\log_{2}\\big(' },
            { re: /^log\(/,                             type: 'func_logy', latex: '\\log\\big(' },
            { re: /^[a-zA-Z_][a-zA-Z0-9_]*\(/,          type: 'func' },
            { re: /^\(/,                                type: 'open' },
            { re: /^\)/,                                type: 'close' },
            { re: /^,/,                                 type: 'comma' },
            { re: /^[+\-*\/^%!]/,                       type: 'op' },
            { re: /^./,                                 type: 'other' },
        ];

        const tokens = [];
        let rem = expr;
        while (rem.length) {
            let matched = false;
            for (const def of TOKEN_DEFS) {
                const m = rem.match(def.re);
                if (m) {
                    tokens.push({ type: def.type, raw: m[0], latex: def.latex });
                    rem = rem.slice(m[0].length);
                    matched = true;
                    break;
                }
            }
            if (!matched) { 
                tokens.push({ type: 'other', raw: rem[0] }); 
                rem = rem.slice(1); 
            }
        }
        return tokens;
    }

    function getParsedMathExpression(expr) {
        let s = expr;
        if (s.endsWith('^')) s = s.slice(0, -1);

        const tokens = tokenizeExpression(s);
        const CUR_VAL  = new Set(['num', 'const', 'close', 'sciNotation']);
        const NEXT_VAL = new Set(['num', 'const', 'func', 'func_sqrt', 'func_cbrt', 'func_nthroot', 'func_ln', 'func_log10', 'func_log2', 'func_logy', 'open', 'sciNotation']);

        const parts = [];
        for (let i = 0; i < tokens.length; i++) {
            const tok = tokens[i];
            parts.push(tok.raw);
            if (i + 1 < tokens.length && CUR_VAL.has(tok.type) && NEXT_VAL.has(tokens[i+1].type)) {
                if (!(tok.type === 'num' && tokens[i+1].type === 'num')) {
                    parts.push('*'); 
                }
            }
        }
        return parts.join('');
    }

    function formatLatexExpression(expr) {
        let s = expr;
        if (s.endsWith('^')) s = s.slice(0, -1);

        const tokens = tokenizeExpression(s);
        const CUR_VAL  = new Set(['num', 'const', 'close', 'sciNotation']);
        const NEXT_VAL = new Set(['num', 'const', 'func', 'func_sqrt', 'func_cbrt', 'func_nthroot', 'func_ln', 'func_log10', 'func_log2', 'func_logy', 'open', 'sciNotation']);

        const parts = [];
        let i = 0;
        while (i < tokens.length) {
            const tok = tokens[i];

            if (tok.type === 'func_sqrt') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type.startsWith('func_')) break;
                    if (tokens[j].type === 'open' || tokens[j].type === 'func') depth++;
                    if (tokens[j].type === 'close') depth--;
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                parts.push(`\\sqrt{${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}}`);
                if (!(j <= tokens.length && depth === 0) && (j === tokens.length || tokens[j].type.startsWith('func_'))) {
                    parts.push('...§GHOST_CLOSE§');
                }
                i = j;
                continue;
            }

            if (tok.type === 'func_cbrt') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type.startsWith('func_')) break;
                    if (tokens[j].type === 'open' || tokens[j].type === 'func') depth++;
                    if (tokens[j].type === 'close') depth--;
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                parts.push(`\\sqrt[3]{${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}}`);
                if (!(j <= tokens.length && depth === 0) && (j === tokens.length || tokens[j].type.startsWith('func_'))) {
                    parts.push('...§GHOST_CLOSE§');
                }
                i = j;
                continue;
            }

            if (tok.type === 'func_nthroot') {
                let depth = 1;
                let innerRaw = '';
                let j = i + 1;
                while (j < tokens.length && depth > 0) {
                    if (tokens[j].type.startsWith('func_')) break;
                    if (tokens[j].type === 'open' || tokens[j].type === 'func') depth++;
                    if (tokens[j].type === 'close') depth--;
                    if (depth > 0) innerRaw += tokens[j].raw;
                    j++;
                }
                
                let commaIdx = innerRaw.indexOf(',');
                if (commaIdx !== -1) {
                    let radicand = innerRaw.substring(0, commaIdx);
                    let indexRoot = innerRaw.substring(commaIdx + 1);
                    parts.push(`\\sqrt[${indexRoot ? formatLatexExpression(indexRoot) : '\\phantom{y}'}]{${radicand ? formatLatexExpression(radicand) : '\\phantom{x}'}}`);
                } else {
                    parts.push(`\\sqrt[\\color{rgba(255,255,255,0.4)}{y}]{${innerRaw ? formatLatexExpression(innerRaw) : '\\phantom{x}'}}`);
                }

                if (!(j <= tokens.length && depth === 0) && (j === tokens.length || tokens[j].type.startsWith('func_'))) {
                    parts.push('...§GHOST_CLOSE§');
                }
                i = j;
                continue;
            }

            parts.push(tok.latex || tok.raw);
            if (i + 1 < tokens.length && CUR_VAL.has(tok.type) && NEXT_VAL.has(tokens[i+1].type)) {
                if (!(tok.type === 'num' && tokens[i+1].type === 'num')) {
                    parts.push('§GHOST§');
                }
            }
            i++;
        }
        s = parts.join('');

        let exponentTokens = [];
        let rem = s;
        while (rem.length) {
            let mExp = rem.match(/^\^([a-zA-Z0-9_.,\\]+|\{[^}]+\})/);
            if (mExp) {
                exponentTokens.push({ type: 'exp', raw: mExp[0], val: mExp[1] });
                rem = rem.slice(mExp[0].length);
            } else {
                let mNormal = rem.match(/^([^^]+)/);
                exponentTokens.push({ type: 'base', raw: mNormal[0] });
                rem = rem.slice(mNormal[0].length);
            }
        }

        let processStr = "";
        for (let token of exponentTokens) {
            if (token.type === 'base') {
                processStr += token.raw;
            } else {
                processStr = `({${processStr}})^{${token.val}}`;
            }
        }
        s = processStr;

        s = s.replace(/\bsqrt\b/g, '\\sqrt');
        s = s.replace(/\*/g, '\\times ');
        s = s.replace(/\//g, '\\div ');

        s = s.replace(/([0-9.]+)[E]([+-]?\d+)/g, '$1\\times10^{$2}');
        s = s.replace(/([0-9.]+)[E]$/g, '$1\\times10^{\\phantom{0}}');

        const openCount  = (s.match(/\(/g) || []).length;
        const closeCount = (s.match(/\)/g) || []).length;
        if (openCount > closeCount) {
            s += '{\\color{rgba(255,255,255,0.22)}{)}}'.repeat(openCount - closeCount);
        }

        s = s.replace(/\.\.\.§GHOST_CLOSE§/g, '{\\color{rgba(255,255,255,0.22)}{)}}');
        s = s.replace(/§GHOST_CLOSE§/g, '{\\color{rgba(255,255,255,0.22)}{)}}');
        s = s.replace(/§GHOST§/g, '{\\color{rgba(255,255,255,0.22)}{\\times}}');

        return s;
    }

    function updateMainDisplay(text) {
      mainDisplay.innerHTML = `$${formatLatexExpression(text)}$`;
      MathJax.typesetPromise([mainDisplay]);
    }

    function evaluateExpression() {
        if (!expression.trim()) return;

        try {
            let parsedExpression = getParsedMathExpression(expression);
            
            if (parsedExpression.endsWith('^')) {
              parsedExpression = parsedExpression.slice(0, -1);
            }

            const openCount = (parsedExpression.match(/\(/g) || []).length;
            const closeCount = (parsedExpression.match(/\)/g) || []).length;
            if (openCount > closeCount) {
              parsedExpression += ')'.repeat(openCount - closeCount);
            }

            if (isDeg) {
              parsedExpression = parsedExpression
                  .replace(/sin\(([^)]+)\)/g, 'sin($1 deg)')
                  .replace(/cos\(([^)]+)\)/g, 'cos($1 deg)')
                  .replace(/tan\(([^)]+)\)/g, 'tan($1 deg)');
            }

            const result = math.evaluate(parsedExpression);
            
            const formattedResult = Number.isFinite(result)
            ? math.format(result, { 
                notation: 'auto',
                precision: 29,
                lowerExp: -29, 
                upperExp: 29   
                })
            : result;

            subDisplay.innerHTML = `$${formatLatexExpression(expression)}$`;
            mainDisplay.innerHTML = `$${formatLatexExpression(String(formattedResult))}$`;

            expression = String(formattedResult);
            hasEvaluated = true; 
            renderButtons(); 

            MathJax.typesetPromise([subDisplay, mainDisplay]);
        } catch (err) {
            mainDisplay.innerHTML = '$\\text{Error}$';
            MathJax.typesetPromise([mainDisplay]);
        }
    }

    document.getElementById('scientificToggle').addEventListener('click', () => {
      scientificMode = !scientificMode;
      renderButtons();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Shift') {
        secondMode = true;
        renderButtons();
      }

      if (e.key === 'ArrowRight') {
        const openedCount = (expression.match(/\(/g) || []).length;
        const closedCount = (expression.match(/\)/g) || []).length;
        if (openedCount > closedCount) {
          expression += ')';
          updateMainDisplay(expression);
        }
      }

      if ((e.ctrlKey || e.metaKey || e.shiftKey) && (e.key === '=' || e.key === '+')) {
        if (e.key === '+' || e.shiftKey) {
          e.preventDefault(); 
        }
      }

      const allowed = '0123456789+-*/().%^,';
      if (allowed.includes(e.key)) {
        appendToExpression(e.key);
      }
      if (e.key === 'Enter') {
        evaluateExpression();
      }
      if (e.key === 'Backspace') {
        handleAction('backspace');
      }
      if (e.key === 'Escape') {
        handleAction('clear');
      }
    }, { passive: false });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Shift') {
        secondMode = false;
        renderButtons();
      }
    });

    renderButtons();
    updateMainDisplay('0');
  </script>
</body>
